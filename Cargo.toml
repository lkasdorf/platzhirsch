[package]
name = "platzhirsch"
version = "0.1.0"
edition = "2024"
description = "Fast disk space analyzer for Windows that reads the NTFS Master File Table directly"
license = "MIT"
repository = "https://github.com/lkasdorf/platzhirsch"
readme = "README.md"
keywords = ["disk-usage", "ntfs", "windows", "treemap", "mft"]
categories = ["filesystem", "visualization"]
publish = false

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = "0.37.0"
rayon = "1.12.0"
rfd = "0.18.0"
windows = { version = "0.62.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
