[package]
name = "platzhirsch"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = "0.37.0"
rayon = "1.12.0"
rfd = "0.18.0"
windows = "0.62.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
