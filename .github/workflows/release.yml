name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and attach platzhirsch.exe
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that the tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tag $env:TAG points at a commit that is not on main"
            exit 1
          }

      - name: Install stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Check that the tag matches the package version
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:TAG -ne "v$version") {
            Write-Error "Tag $env:TAG does not match the package version $version in Cargo.toml"
            exit 1
          }

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Checksum
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/platzhirsch.exe dist/platzhirsch.exe
          $hash = (Get-FileHash dist/platzhirsch.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/dist/platzhirsch.exe.sha256", "$hash  platzhirsch.exe`n")
          "SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "SHA-256: $hash"

      - name: Release notes
        run: |
          # Take this version's section from the changelog, if there is one.
          $version = $env:TAG.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $section = @()
          $inside = $false
          foreach ($line in $lines) {
            if ($line.StartsWith("## [")) {
              if ($inside) { break }
              $inside = $line.StartsWith("## [$version]")
              continue
            }
            if ($inside -and -not $line.StartsWith("[")) { $section += $line }
          }
          $notes = @()
          if ($section.Count -gt 0) { $notes += ($section -join "`n").Trim(); $notes += "" }
          $notes += "## Download"
          $notes += ""
          $notes += "``platzhirsch.exe`` is a single file for Windows 10 and 11 (x64). No installer."
          $notes += ""
          $notes += "SHA-256: ``$env:SHA256``"
          $notes += ""
          $notes += "The executable is not code-signed, so Windows SmartScreen may warn on the first start."
          [IO.File]::WriteAllText("$PWD/dist/notes.md", ($notes -join "`n") + "`n")
          Get-Content dist/notes.md

      - name: Attach to the GitHub release
        run: |
          gh release view $env:TAG --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            # The release already exists (created by hand): add or replace the files.
            gh release upload $env:TAG dist/platzhirsch.exe dist/platzhirsch.exe.sha256 --clobber
          } else {
            gh release create $env:TAG dist/platzhirsch.exe dist/platzhirsch.exe.sha256 --title "Platzhirsch $env:TAG" --notes-file dist/notes.md --verify-tag
          }
          exit $LASTEXITCODE
